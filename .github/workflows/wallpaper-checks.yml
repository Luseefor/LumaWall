name: Wallpaper checks

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wallpaper-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wallpaper:
    name: Wallpaper checks (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        # The job names are required checks; keep the runner labels.
        # Each runner pins its own Xcode. 26.3 is the oldest toolchain the
        # app supports. macos-26 has no Xcode 27 yet (that lives only on the
        # xcode-27 preview image), so both stay on 26.3 for now.
        include:
          - runner: macos-15
            xcode: /Applications/Xcode_26.3.app
          - runner: macos-26
            xcode: /Applications/Xcode_26.3.app
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: ${{ matrix.xcode }}/Contents/Developer
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Pinned: the committed project is generated with this version, and
      # newer releases write different defaults (2.47.0 changed
      # LastUpgradeCheck and the scheme), failing the committed-project check.
      - name: Install XcodeGen
        env:
          XCODEGEN_VERSION: 2.46.0
          XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" --version
      - name: Show selected toolchain
        run: |
          test -d "$DEVELOPER_DIR" || { echo "::error::$DEVELOPER_DIR is not on this image"; exit 1; }
          xcodebuild -version
          swift --version
      - name: Check wallpaper playback and release build
        env:
          LUMAWALL_CHECK_OUTPUT_DIR: ${{ runner.temp }}/lumawall-checks
        run: ./ci/check.sh
      - name: Check generated project is committed
        run: git diff --exit-code -- LumaWall.xcodeproj
      - name: Save logs and rendered playback test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wallpaper-results-${{ matrix.runner }}
          path: ${{ runner.temp }}/lumawall-checks
          if-no-files-found: ignore
          retention-days: 14
