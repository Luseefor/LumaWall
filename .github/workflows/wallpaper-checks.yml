name: Wallpaper checks

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wallpaper-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wallpaper:
    name: Wallpaper checks (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-26]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Show selected toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Check wallpaper playback and release build
        env:
          LUMAWALL_CHECK_OUTPUT_DIR: ${{ runner.temp }}/lumawall-checks
        run: ./ci/check.sh
      - name: Check generated project is committed
        run: git diff --exit-code -- LumaWall.xcodeproj
      - name: Save logs and rendered playback test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wallpaper-results-${{ matrix.runner }}
          path: ${{ runner.temp }}/lumawall-checks
          if-no-files-found: ignore
          retention-days: 14
