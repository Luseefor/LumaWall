name: LumaWall
configs:
  Debug: debug
  Release: release
  Testing: debug
options:
  bundleIdPrefix: app.lumawall
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
    # Every target, tests included: new warnings fail the build.
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES

targets:
  LumaWallCore:
    type: framework
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources/LumaWallCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lumawall.personal.core
        PRODUCT_NAME: LumaWallCore
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "0.4.1"
        CURRENT_PROJECT_VERSION: "13"
        SKIP_INSTALL: YES
        DEFINES_MODULE: YES

  LumaWall:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources/LumaWallApp
        excludes:
          - Resources
      - path: Sources/LumaWallApp/Resources
        buildPhase: resources
      - path: LICENSE
        buildPhase: resources
      - path: NOTICE
        buildPhase: resources
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
      - path: Packaging/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lumawall.personal
        PRODUCT_NAME: LumaWall
        INFOPLIST_FILE: Packaging/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "0.4.1"
        CURRENT_PROJECT_VERSION: "13"
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        CODE_SIGN_ENTITLEMENTS: Packaging/LumaWall.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        COMBINE_HIDPI_IMAGES: YES
      configs:
        Testing:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) LUMAWALL_TEST_HOST"
          PRODUCT_BUNDLE_IDENTIFIER: app.lumawall.personal.test-host
    dependencies:
      - target: LumaWallCore
        embed: true
      - target: LumaWallWallpaper
        embed: true
      - target: LumaWallMediaService
        embed: true

  # Parses imported media in App Sandbox with no file entitlements; the app
  # sends it open read-only file handles. See Sources/LumaWallCore/MediaProbe.swift.
  LumaWallMediaService:
    type: xpc-service
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources/LumaWallMediaService
      # Only the probe and its XPC contract, not all of LumaWallCore.
      - path: Sources/LumaWallCore/MediaProbe.swift
      - path: Sources/LumaWallCore/LocalMediaProbe.swift
      - path: Sources/LumaWallCore/MediaServiceProtocol.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lumawall.personal.media
        PRODUCT_NAME: LumaWallMediaService
        INFOPLIST_FILE: Packaging/LumaWallMediaService-Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "LumaWall Media Service"
        MARKETING_VERSION: "0.4.1"
        CURRENT_PROJECT_VERSION: "13"
        CODE_SIGN_ENTITLEMENTS: Packaging/LumaWallMediaService.entitlements
        SKIP_INSTALL: YES

  LumaWallWallpaper:
    type: extensionkit-extension
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: WallpaperExtension
        excludes:
          - Info.plist
          - NOTICE
          - LICENSE-Phosphene
          - PrivacyInfo.xcprivacy
          - WallpaperExtension-Bridging-Header.h
          - LumaWallWallpaper.entitlements
      - path: WallpaperExtension/NOTICE
        buildPhase: resources
      - path: WallpaperExtension/LICENSE-Phosphene
        buildPhase: resources
      - path: WallpaperExtension/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lumawall.personal.wallpaper
        PRODUCT_NAME: LumaWallWallpaper
        INFOPLIST_FILE: WallpaperExtension/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "LumaWall Wallpaper"
        MARKETING_VERSION: "0.4.1"
        CURRENT_PROJECT_VERSION: "13"
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        SWIFT_OBJC_BRIDGING_HEADER: WallpaperExtension/WallpaperExtension-Bridging-Header.h
        CODE_SIGN_ENTITLEMENTS: WallpaperExtension/LumaWallWallpaper.entitlements
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        SKIP_INSTALL: YES
      configs:
        Testing:
          PRODUCT_BUNDLE_IDENTIFIER: app.lumawall.personal.test-host.wallpaper

  LumaWallAppTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Tests/LumaWallAppTests
    dependencies:
      - target: LumaWall
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lumawall.personal.tests
        GENERATE_INFOPLIST_FILE: YES

  WallpaperExtensionTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Tests/WallpaperExtensionTests
      # The extension can't host a test bundle; compile its pure sources here.
      - path: WallpaperExtension/VariantSelection.swift
      - path: WallpaperExtension/PlaybackPolicy.swift
      - path: WallpaperExtension/ThermalHold.swift
      - path: WallpaperExtension/RendererLifecycle.swift
      - path: WallpaperExtension/LogFile.swift
      - path: WallpaperExtension/LogRedaction.swift
      - path: WallpaperExtension/MirrorDump.swift
      - path: WallpaperExtension/RendererCopy.swift
      - path: WallpaperExtension/DisplaySleep.swift
      - path: WallpaperExtension/SurfaceSlot.swift
      - path: WallpaperExtension/RampMath.swift
      - path: WallpaperExtension/LoopTiming.swift
      - path: WallpaperExtension/PowerPolling.swift
      - path: WallpaperExtension/PrefsReload.swift
      - path: WallpaperExtension/LibraryScanRecord.swift
      - path: WallpaperExtension/LibraryEntryScan.swift
      - path: WallpaperExtension/PathSafety.swift
      - path: WallpaperExtension/StillCache.swift
      - path: WallpaperExtension/StillCacheStore.swift
      - path: WallpaperExtension/CallerAdmission.swift
      - path: WallpaperExtension/ChoiceRemoval.swift
      - path: WallpaperExtension/NotificationGuards.swift
      - path: WallpaperExtension/RuntimeLayout.swift
      - path: WallpaperExtension/CompanionLaunch.swift
      - path: WallpaperExtension/CodableShims.swift
      - path: WallpaperExtension/VideoSettingsItem.swift
      - path: WallpaperExtension/HealthReply.swift
      # Shared with the app tests so both sides check the same rows.
      - path: Tests/LumaWallAppTests/QHDFitFixtures.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lumawall.personal.extension-tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  LumaWall:
    build:
      targets:
        LumaWall: all
    run:
      config: Debug
    test:
      config: Testing
      targets:
        - LumaWallAppTests
        - WallpaperExtensionTests
    profile:
      config: Release
    archive:
      config: Release
