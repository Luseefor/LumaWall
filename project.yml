name: LumaWall
options:
  bundleIdPrefix: app.lumawall
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES

targets:
  LumaWallCore:
    type: framework
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources/LumaWallCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lumawall.personal.core
        PRODUCT_NAME: LumaWallCore
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "0.4.0"
        CURRENT_PROJECT_VERSION: "12"
        SKIP_INSTALL: YES
        DEFINES_MODULE: YES

  LumaWall:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources/LumaWallApp
        excludes:
          - Resources
      - path: Sources/LumaWallApp/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lumawall.personal
        PRODUCT_NAME: LumaWall
        INFOPLIST_FILE: Packaging/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "0.4.0"
        CURRENT_PROJECT_VERSION: "12"
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        CODE_SIGN_ENTITLEMENTS: Packaging/LumaWall.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        COMBINE_HIDPI_IMAGES: YES
    dependencies:
      - target: LumaWallCore
        embed: true
      - target: LumaWallWallpaper
        embed: true
    scheme:
      testTargets: []

  LumaWallWallpaper:
    type: extensionkit-extension
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: WallpaperExtension
        excludes:
          - Info.plist
          - NOTICE
          - LICENSE-Phosphene
          - WallpaperExtension-Bridging-Header.h
          - LumaWallWallpaper.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lumawall.personal.wallpaper
        PRODUCT_NAME: LumaWallWallpaper
        INFOPLIST_FILE: WallpaperExtension/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "LumaWall Wallpaper"
        MARKETING_VERSION: "0.4.0"
        CURRENT_PROJECT_VERSION: "12"
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        SWIFT_OBJC_BRIDGING_HEADER: WallpaperExtension/WallpaperExtension-Bridging-Header.h
        CODE_SIGN_ENTITLEMENTS: WallpaperExtension/LumaWallWallpaper.entitlements
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        SKIP_INSTALL: YES
